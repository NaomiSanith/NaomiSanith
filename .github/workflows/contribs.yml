
name: Generate Contribution Calendar

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution calendar
        uses: salty-sweet/render-contribs@main
        with:
          github_token: ${{ secrets.CONTRIBS_TOKEN }}
          zone: "Asia/Kolkata"
          output_path: "assets/contributions.png"
          custom_theme: >-
            {
              "background": "#00000000",
              "text": "#805B50",
              "meta": "#805B50",
              "grade0": "#F8E8D5",
              "grade1": "#F4CBA5",
              "grade2": "#EDA477",
              "grade3": "#DC795A",
              "grade4": "#A94F46"
            }
